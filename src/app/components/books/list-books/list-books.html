<div class="card">
    <div class="card-header">
        Books list
    </div>
    <div class="card-body">
        <div class="alert alert-danger mb-3" *ngIf="isError">
           {{ errorMessage }}
        </div>
        <table class="table" *ngIf="!isLoading && !isError">
            <thead>
                <tr>
                    <th>Nr.</th>
                    <th>Title</th>
                    <th>Authors</th>
                    <th>Description</th>
                    <th>Pages count</th>
                    <th>ISBN</th>
                    <th>Actions</th>
                </tr>
                <tr>
                    <th></th>
                    <th>
                        <input type="text" class="form-control" [(ngModel)]="filterTitle" (keyup)="filterBooks()" placeholder="Filter by title..." aria-label="Filter by title">
                    </th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th>
                        <input type="text" class="form-control" [(ngModel)]="filterISBN" (keyup)="filterBooks()" placeholder="Filter by ISBN number..." aria-label="Filter by ISBN number">
                    </th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="books && books.length === 0">
                    <td colspan="7" class="text-center text-muted py-4">
                        No books found
                    </td>
                </tr>
                <tr *ngFor="let book of books; let i=index">
                    <td>{{ i+1 }}</td>
                    <td>{{ book.title }}</td>
                    <td>
                        <span *ngFor="let author of book.authors; let last = last">
                            {{ author.name }} {{ author.surname }}<ng-container *ngIf="!last">, </ng-container>
                        </span>
                    </td>
                    <td>{{ book.short_description || '-' }}</td>
                    <td>{{ book.pages }}</td>
                    <td>{{ book.isbn }}</td>
                    <td>
                        <button class="btn btn-sm btn-primary me-2" (click)="onEdit(book)" title="Edit book">Edit</button>
                        <button class="btn btn-sm btn-danger" (click)="onDelete(book)" title="Delete book">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="alert alert-info" *ngIf="isLoading">
            Data is being retrieved from the server
        </div>
    </div>
</div>
